# Runs pytest + offline smoke from leon_web_intel (Ubuntu + Python 3.11).
name: leon_web_intel CI

on:
  push:
    branches: [main]
    paths:
      - "leon_web_intel/**"
      - ".github/workflows/leon_web_intel_ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "leon_web_intel/**"
      - ".github/workflows/leon_web_intel_ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leon_web_intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: leon_web_intel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare CI result files folder
        run: mkdir -p ci-results

      - name: Profile dry-run (no HTTP)
        run: python run_profile.py --input config/sources_raw.txt --dry-run 2>&1 | tee ci-results/dry_run.txt

      - name: Pytest
        run: python -m pytest -v --tb=short --junitxml=ci-results/pytest-junit.xml

      - name: Upload result files (JUnit + dry-run log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leon-web-intel-ci-results
          path: leon_web_intel/ci-results/
          if-no-files-found: warn
