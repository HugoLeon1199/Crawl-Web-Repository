user_agent: "LeonWebIntelBot/0.1 (+local research project; contact: none)"
request_timeout_seconds: 20
max_retries: 2
default_delay_seconds: 1.5
concurrency: 5
profile_cache_days: 7
http_cache_enabled: true

max_rss_candidates: 20
max_sitemap_candidates: 10
max_sitemaps_to_parse_in_profiler: 5
max_urls_from_sitemap_in_profiler: 200

min_extract_text_length: 300
min_article_content_length: 300
sample_max_articles_per_source: 5

rss_candidate_paths:
  - /feed
  - /rss
  - /rss.xml
  - /atom.xml
  - /feed.xml
  - /rss.htm
  - /rss.html
  - /news/rss
  - /rss/news.xml

sitemap_candidate_paths:
  - /sitemap.xml
  - /sitemap_index.xml
  - /sitemap-news.xml
  - /news-sitemap.xml
  - /sitemap.xml.gz

js_detection:
  min_text_length: 500
  script_count_threshold: 15
  js_keywords:
    - "__NEXT_DATA__"
    - "window.__INITIAL_STATE__"
    - "id=\"root\""
    - "id=\"app\""
    - "app-root"

paywall_keywords:
  - subscribe
  - subscription
  - premium
  - sign in to continue
  - login to continue
  - register to read
  - paywall
  - captcha
  - access denied
  - forbidden
  - cloudflare
  - verify you are human

login_keywords:
  - sign in
  - log in
  - login
  - register to read

captcha_keywords:
  - captcha
  - verify you are human
  - recaptcha

# Commercial / rights-sensitive publishers → prefer metadata-only paths when heuristic hits paywall/HTML-only strategies
prefer_metadata_only_domains:
  - reuters.com
  - apnews.com
  - ft.com
  - wsj.com
  - nikkei.com
  - caixin.com
